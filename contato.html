<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquatro - Contato</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero-header">
    <div class="overlay">
      <div class="hero-content">
        <a href="quem.html">
        <img src="image/logo.png" alt="logo arquatro" class="logo-hero">
        </a>
        <div class="text-hero">
          <h1 class="site-title">Arquatro</h1>
          <p class="subtitle">Arquitetura & Engenharia</p>
        </div>
      </div>
    </div>
    <nav>
      <a href="quem.html" class="active">Quem Somos</a>
      <a href="servicos.html">Serviços</a>
      <a href="at.html">Assistência Técnica</a>
      <a href="cursos.html">Cursos</a>
      <a href="portfolio.html">Portfólio</a>
      <a href="contato.html">Contato</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h2 class="hero h2">Entre em Contato</h2>
      <p class="herocont">Quer falar conosco? Escreva aqui sua dúvida ou sujestão.</p>
    </section>

    <section class="contato">
      <form>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Nome completo" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="email@gmail.com" required>

        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem aqui..." required></textarea>

        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2025 Arquatro — Arquitetura & Engenharia</p>
  </footer>
</body>
</html>
